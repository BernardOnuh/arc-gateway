<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Drop-in cross-chain gateway to the ARC network for your business." />
    <meta name="theme-color" content="#3d5fae" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Stableflowr</title>
  </head>
  <body>
    <script>
      // Pick day or night before first paint (no flash). Mirrors src/lib/theme.tsx.
      try {
        var pref = localStorage.getItem("arc-gateway.theme");
        var h = new Date().getHours();
        var dark = pref === "dark" || (pref !== "light" && (h >= 19 || h < 6));
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
