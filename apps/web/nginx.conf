server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /healthz { access_log off; return 200 "ok"; }

  # Hashed build assets never change: cache for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # Widget bundle for partner sites: cross-origin loadable, short cache so updates roll out.
  location /widget/ {
    add_header Access-Control-Allow-Origin * always;
    add_header Cache-Control "public, max-age=300";
    try_files $uri =404;
  }

  # SPA: every other path serves index.html (never cached, so deploys show up immediately).
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri $uri/ /index.html;
  }
}
