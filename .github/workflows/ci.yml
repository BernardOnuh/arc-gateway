name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
          POSTGRES_DB: gateway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://gateway:gateway@localhost:5432/gateway
      REDIS_URL: redis://localhost:6379
      ARC_RPC_URL: https://rpc.testnet.arc.network
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build API and apply migrations
        run: pnpm build && node dist/migrate.js

      - name: API tests
        run: pnpm test

      - name: SDK (typecheck, test, build)
        working-directory: packages/gateway-sdk
        run: pnpm exec tsc -p tsconfig.json --noEmit && pnpm test && pnpm build

      - name: Widget (typecheck, test, build)
        working-directory: packages/arc-widget
        run: pnpm exec tsc -p tsconfig.json --noEmit && pnpm test && pnpm build

      - name: Web (typecheck, test, build)
        working-directory: apps/web
        run: pnpm exec tsc -p tsconfig.json --noEmit && pnpm test && pnpm build
        env:
          VITE_GATEWAY_URL: https://api.example.com

  docker:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t arc-gateway-api:${{ github.sha }} .
      - name: Build web image
        run: docker build -f apps/web/Dockerfile --build-arg VITE_GATEWAY_URL=https://api.example.com -t arc-gateway-web:${{ github.sha }} .
